<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0f10">
<meta name="description" content="Flinch — a reaction duel on a shooting range. Don't flinch. Find the card, one shot, five rounds.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flinch">
<title>Flinch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>
  /* ------------------------------------------------------------------
     Fonts are self-hosted (Barlow and Barlow Condensed, Latin subset,
     SIL Open Font License) so the game has no network dependency at
     all: it must look the same in a tunnel as on Wi-Fi. No <link
     rel=preload> for them: font preloads need CORS mode, which fails
     from file://, and file:// must keep working.
     ------------------------------------------------------------------ */
  @font-face { font-family: "Barlow"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/barlow-400.woff2) format("woff2"); }
  @font-face { font-family: "Barlow"; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/barlow-600.woff2) format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/barlow-condensed-500.woff2) format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/barlow-condensed-700.woff2) format("woff2"); }

  /* ------------------------------------------------------------------
     Palette: an indoor range at night. Cold gloom downrange, one warm
     lamp over the target, and the red/green lane light that real ranges
     use to mean "hold" and "range is hot". The signal in the fiction is
     the same signal in the mechanic — that's why it reads instantly.
     ------------------------------------------------------------------ */
  :root {
    --gloom:  #0b0f10;
    --lane:   #141b1c;
    --paper:  #d8c9a8;
    --hot:    #c4483a;
    --clear:  #6e9e62;
    --lamp:   #e8c77a;
    --chalk:  #b9c4c0;
    --dim:    #6d7c7a;
    --cond:   "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
    --sans:   "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  html, body {
    height: 100%;
    background: var(--gloom);
    color: var(--chalk);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  body {
    display: grid;
    place-items: center;
    /* Stop the browser hijacking taps as scroll/zoom gestures. Without
       this, iOS Safari eats ~300ms on every tap and the reaction timing
       becomes meaningless. */
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    position: relative;
    width: min(100vw, calc(100vh * 0.5625));
    width: min(100vw, calc(100dvh * 0.5625));
    aspect-ratio: 540 / 960;
    max-height: 100dvh;
    background: var(--lane);
    overflow: hidden;
    box-shadow: 0 0 0 1px #05080a, 0 30px 80px rgba(0,0,0,.6);
    cursor: crosshair;
  }

  #game { display: block; width: 100%; height: 100%; }

  button {
    font: inherit; color: inherit; background: none; border: 0; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Scoreboard ---------- */
  #hud {
    position: absolute; inset: 0 0 auto 0;
    display: grid;
    /* The sides never wrap: the level name in the middle gives way first. */
    grid-template-columns: minmax(64px, 1fr) minmax(0, auto) minmax(64px, 1fr);
    align-items: start;
    gap: 12px;
    padding: 18px 20px 0;
    pointer-events: none;
    background: linear-gradient(rgba(5,8,9,.55), rgba(5,8,9,0));
  }
  .side { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .side.opp { text-align: right; }
  .label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
  .score {
    font-family: var(--cond);
    font-weight: 700; font-size: 44px; line-height: .9;
    font-variant-numeric: tabular-nums;
    color: var(--chalk);
    display: inline-block;
    transform-origin: 50% 70%;
  }
  .side.opp .score { color: #93a3a0; }
  .side.opp.fired .score { color: var(--hot); }
  .score.pop { animation: pop .42s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop {
    0%   { transform: scale(1); }
    25%  { transform: scale(1.32); color: var(--paper); }
    100% { transform: scale(1); }
  }

  .mid { display: flex; flex-direction: column; align-items: center; gap: 7px; padding-top: 8px; min-width: 0; max-width: 100%; }
  .pips { display: flex; gap: 6px; }
  .pips i {
    width: 16px; height: 5px;
    background: #2c3838;
    display: block;
    transition: background .25s, box-shadow .25s;
  }
  .pips i.won  { background: var(--clear); box-shadow: 0 0 10px rgba(110,158,98,.5); }
  .pips i.lost { background: var(--hot);   box-shadow: 0 0 10px rgba(196,72,58,.5); }
  #levelTag {
    font-family: var(--cond); font-weight: 500; font-size: 14px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--dim);
    white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---------- Status line at the firing line ---------- */
  #signal {
    position: absolute; inset: auto 0 0 0;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 0 20px 24px;
    pointer-events: none;
  }
  #status {
    font-family: var(--cond);
    font-weight: 700; font-size: 24px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--chalk);
    text-shadow: 0 2px 12px rgba(0,0,0,.8);
  }
  #sub {
    font-size: 12px; color: var(--dim);
    font-variant-numeric: tabular-nums;
    min-height: 15px;
  }
  #note {
    position: absolute; left: 0; right: 0; top: 108px;
    text-align: center; font-size: 12px; color: var(--paper);
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  #note.show { opacity: 1; }

  /* ---------- Round banner ---------- */
  #banner {
    position: absolute; left: 0; right: 0; top: 66%;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transform: scale(.7);
  }
  #banner.show {
    opacity: 1; transform: scale(1);
    transition: opacity .12s ease-out, transform .38s cubic-bezier(.34,1.56,.64,1);
  }
  #banner .verdict {
    font-family: var(--cond);
    font-weight: 700; font-size: 38px; letter-spacing: .04em; text-transform: uppercase;
    text-shadow: 0 2px 18px rgba(0,0,0,.85);
  }
  #banner .detail { font-size: 13px; color: var(--chalk); font-variant-numeric: tabular-nums; text-shadow: 0 1px 8px rgba(0,0,0,.9); }
  #banner.good .verdict { color: var(--paper); }
  #banner.bad  .verdict { color: var(--hot); }
  /* The new-best tag: the one number players screenshot deserves a moment. */
  #bannerBest {
    display: inline-block; margin-top: 8px;
    font-family: var(--cond); font-weight: 700; font-size: 15px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--gloom); background: var(--lamp);
    padding: 3px 10px 2px; border-radius: 2px;
    box-shadow: 0 0 22px rgba(232,199,122,.55);
    animation: bestPop .7s cubic-bezier(.2,1.5,.4,1);
  }
  @keyframes bestPop {
    0%   { transform: scale(.4) rotate(-6deg); opacity: 0; }
    45%  { transform: scale(1.18) rotate(2deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  /* ---------- Cards: title, level clear, level lost ---------- */
  #overlay {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: linear-gradient(rgba(6,10,11,.82), rgba(6,10,11,.5) 45%, rgba(6,10,11,.82));
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    padding: 24px 24px 48px;
    text-align: center;
    opacity: 0; transition: opacity .35s;
  }
  #overlay.in { opacity: 1; }
  #overlay > .card { transform: translateY(10px); transition: transform .45s cubic-bezier(.2,1,.3,1); max-height: 100%; width: 100%; }
  #overlay.in > .card { transform: none; }
  #kicker {
    font-family: var(--cond); font-weight: 500; font-size: 15px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--lamp);
  }
  #overlay h1 {
    font-family: var(--cond);
    font-weight: 700; font-size: 58px; line-height: .95;
    letter-spacing: .01em; color: var(--paper);
    margin-top: 6px;
    text-shadow: 0 4px 30px rgba(0,0,0,.6);
  }
  #overlay p { font-size: 14px; color: var(--chalk); max-width: 32ch; margin: 12px auto 0; line-height: 1.5; }
  #overlay .rules { color: var(--dim); font-size: 13px; margin-top: 12px; }
  #overlay .cue {
    margin-top: 20px; color: var(--clear);
    font-family: var(--cond);
    font-size: 18px; letter-spacing: .08em; text-transform: uppercase;
    animation: breathe 2.2s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

  /* Level select: ten chips, two rows. Cleared levels show their best time. */
  .levels {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    max-width: 320px; margin: 18px auto 0;
    pointer-events: auto;
  }
  .chip {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 44px; padding: 5px 2px 4px;
    border: 1px solid rgba(185,196,192,.16); border-radius: 3px;
    background: rgba(20,27,28,.55);
    font-family: var(--cond); font-weight: 700; font-size: 20px; line-height: 1;
    color: var(--chalk);
    transition: transform .12s, background .2s, border-color .2s;
  }
  .chip .ms { font-family: var(--sans); font-weight: 400; font-size: 10px; letter-spacing: .02em; color: var(--dim); margin-top: 3px; font-variant-numeric: tabular-nums; min-height: 11px; }
  .chip.done { border-color: rgba(110,158,98,.5); color: var(--paper); }
  .chip.done .ms { color: var(--clear); }
  .chip.next { border-color: var(--lamp); color: var(--lamp); background: rgba(232,199,122,.08); box-shadow: 0 0 16px rgba(232,199,122,.18); }
  .chip.locked { color: #3f4c4b; border-color: rgba(185,196,192,.07); cursor: default; }
  .chip:not(.locked):active { transform: scale(.94); }

  /* Daily challenge row. */
  .daily {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    max-width: 320px; margin: 10px auto 0; padding: 9px 12px;
    border: 1px solid rgba(185,196,192,.16); border-radius: 3px;
    background: rgba(20,27,28,.55);
    text-align: left; pointer-events: auto; width: 100%;
  }
  .daily.ready { border-color: rgba(232,199,122,.55); }
  .daily.done { cursor: default; }
  .daily > span:first-child { display: flex; flex-direction: column; min-width: 0; }
  .daily .dk { font-family: var(--cond); font-weight: 700; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--lamp); }
  .daily.done .dk { color: var(--dim); }
  .daily .dt { font-size: 12px; color: var(--chalk); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .daily .da { font-family: var(--cond); font-weight: 700; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: var(--clear); white-space: nowrap; }
  .daily.done .da { color: var(--dim); font-size: 12px; letter-spacing: .06em; }
  .daily:not(.done):active { transform: scale(.98); }

  #record { color: var(--dim); font-size: 12px; margin-top: 12px; font-variant-numeric: tabular-nums; }
  #record b { color: var(--chalk); font-weight: 600; }

  .actions { display: flex; justify-content: center; gap: 10px; margin-top: 18px; pointer-events: auto; }
  .actions button {
    font-family: var(--cond); font-weight: 700; font-size: 14px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--chalk); border: 1px solid rgba(185,196,192,.28); border-radius: 3px;
    padding: 8px 16px 7px; background: rgba(20,27,28,.6);
  }
  .actions button:active { transform: scale(.96); }

  #reset {
    position: absolute; left: 0; right: 0; bottom: 22px;
    font-size: 11px; color: var(--dim); text-decoration: underline;
    pointer-events: auto; cursor: pointer;
  }

  /* Mute sits bottom-left under the lane signal; the shooter's pistol
     owns the bottom-right corner of the canvas. */
  #mute {
    position: absolute; left: 14px; bottom: 16px;
    font-family: var(--cond); font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--dim); background: rgba(20,27,28,.6);
    border: 1px solid rgba(185,196,192,.18); border-radius: 3px;
    padding: 5px 9px; cursor: pointer; pointer-events: auto;
    z-index: 5;
  }
  #mute.off { color: var(--hot); }

  @media (prefers-reduced-motion: reduce) {
    #banner.show { transition: opacity .1s; }
    .score.pop { animation: none; }
    #bannerBest { animation: none; }
    #overlay .cue { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="game"></canvas>

  <header id="hud">
    <div class="side you">
      <span class="label">You</span>
      <span class="score" id="youScore">0</span>
    </div>
    <div class="mid">
      <div class="pips" id="pips"></div>
      <div id="levelTag">Level 1</div>
    </div>
    <div class="side opp" id="oppSide">
      <span class="label">Lane 8</span>
      <span class="score" id="oppScore">0</span>
    </div>
  </header>

  <p id="note"></p>

  <div id="banner">
    <div class="verdict" id="verdict"></div>
    <div class="detail" id="detail"></div>
    <div id="bannerBest" hidden>New best</div>
  </div>

  <div id="signal">
    <p id="status">Range cold</p>
    <p id="sub"></p>
  </div>

  <button id="mute" type="button">sound</button>

  <div id="overlay" hidden>
    <div class="card">
      <div id="kicker">Level 1</div>
      <h1 id="title">Flinch</h1>
      <p id="blurb"></p>
      <p class="rules" id="rules"></p>
      <div class="levels" id="levels" hidden></div>
      <button class="daily" id="daily" type="button" hidden>
        <span><span class="dk" id="dailyKicker">Daily</span><span class="dt" id="dailyText"></span></span>
        <span class="da" id="dailyAction">Play</span>
      </button>
      <p id="record" hidden></p>
      <p class="cue" id="cue">Tap anywhere to start</p>
      <div class="actions" id="actions" hidden>
        <button id="share" type="button">Share</button>
      </div>
    </div>
    <span id="reset" hidden>Reset progress</span>
  </div>
</div>

<!-- Load order matters: each file adds to the shared L7 namespace. No build step. -->
<script src="src/config.js"></script>
<script src="src/rng.js"></script>
<script src="src/store.js"></script>
<script src="src/daily.js"></script>
<script src="src/shapes.js"></script>
<script src="src/sim.js"></script>
<script src="src/sound.js"></script>
<script src="src/engine/tween.js"></script>
<script src="src/engine/particles.js"></script>
<script src="src/engine/camera.js"></script>
<script src="src/engine/sprites.js"></script>
<script src="src/engine/input.js"></script>
<script src="src/render.js"></script>
<script src="src/hud.js"></script>
<script src="src/main.js"></script>
</body>
</html>
